<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>외래어 우리말 순화어 과거시험</title>
  <!-- Tailwind CSS CDN -->
  <script src="../vendor/tailwind.js"></script>
  <!-- Google Fonts: 한국 전통 감성 명조 및 손글씨 폰트 -->
  <style>
    :root {
      --hanji-bg: #f8f4ea;
      --ink-black: #221f1c;
      --dancheong-red: #c83e3b;
      --dancheong-blue: #234d70;
      --dancheong-green: #2c6e58;
      --dancheong-yellow: #d99b26;
    }

    body {
      font-family: 'Noto Serif KR', 'Gowun Batang', serif;
      background-color: var(--hanji-bg);
      color: var(--ink-black);
      min-height: 100vh;
      overflow-x: hidden;
      /* 한지 질감 + 은은한 창호지 격자 패턴 */
      background-image: 
        linear-gradient(rgba(176, 154, 120, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(176, 154, 120, 0.08) 1px, transparent 1px),
        radial-gradient(rgba(200, 62, 59, 0.045) 1px, transparent 0),
        linear-gradient(180deg, #fcf9f2 0%, #efe6d5 100%);
      background-size: 44px 44px, 44px 44px, 22px 22px, 100% 100%;
    }

    .font-batang {
      font-family: 'Gowun Batang', 'Noto Serif KR', serif;
    }

    .font-pen {
      font-family: 'Nanum Pen Script', cursive;
    }

    /* 한지 두루마리 및 창호 카드 */
    .hanji-card {
      background: rgba(255, 253, 248, 0.96);
      border: 2px solid #dcccb0;
      box-shadow: 
        0 20px 50px -12px rgba(42, 32, 18, 0.16),
        inset 0 0 36px rgba(235, 223, 200, 0.5);
      position: relative;
    }

    /* 한옥 세살문 창살 패턴 */
    .changsal-grid {
      background-image: 
        linear-gradient(to right, rgba(168, 145, 112, 0.12) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(168, 145, 112, 0.12) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    /* 단청 오방색 띠 */
    .dancheong-ribbon {
      height: 7px;
      background: linear-gradient(90deg, 
        #234d70 0%, #234d70 20%, 
        #c83e3b 20%, #c83e3b 40%, 
        #d99b26 40%, #d99b26 60%, 
        #fcf9f2 60%, #fcf9f2 80%, 
        #2c6e58 80%, #2c6e58 100%
      );
    }

    /* 전통 네 귀퉁이 문양 */
    .corner-frame {
      position: absolute;
      width: 22px;
      height: 22px;
      border-color: #c83e3b;
      opacity: 0.6;
      pointer-events: none;
    }
    .c-tl { top: 10px; left: 10px; border-top: 2px solid; border-left: 2px solid; }
    .c-tr { top: 10px; right: 10px; border-top: 2px solid; border-right: 2px solid; }
    .c-bl { bottom: 10px; left: 10px; border-bottom: 2px solid; border-left: 2px solid; }
    .c-br { bottom: 10px; right: 10px; border-bottom: 2px solid; border-right: 2px solid; }

    /* 전통 낙관(붉은 도장) */
    .red-stamp {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #c83e3b;
      color: #c83e3b;
      background: rgba(200, 62, 59, 0.06);
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    /* 애니메이션 */
    @keyframes popIn {
      0% { opacity: 0; transform: translateY(12px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-pop {
      animation: popIn 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    .animate-shake {
      animation: shake 0.32s ease-in-out;
    }

    /* 떠다니는 배경 매화 꽃잎 */
    @keyframes floatPetal {
      0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 0; }
      15% { opacity: 0.7; }
      85% { opacity: 0.6; }
      100% { transform: translateY(105vh) translateX(45px) rotate(360deg); opacity: 0; }
    }
    .ambient-petal {
      position: fixed;
      top: -5vh;
      pointer-events: none;
      z-index: 1;
      animation: floatPetal linear infinite;
    }

    .option-card {
      transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .option-card:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: #234d70;
      background-color: #fbf7ef;
      box-shadow: 0 6px 16px rgba(35, 77, 112, 0.12);
    }
  </style>
<style>.hidden{display:none!important}button:focus-visible{outline:3px solid #b77142;outline-offset:3px}</style>

    // 선택지를 무작위로 섞으면서 정답 인덱스를 정확히 유지하는 함수
    function prepareShuffledQuestion(q) {
      const paired = q.options.map((text, idx) => ({
        text,
        isCorrect: idx === q.correctIndex
      }));
      for (let i = paired.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [paired[i], paired[j]] = [paired[j], paired[i]];
      }
      return {
        ...q,
        options: paired.map(p => p.text),
        correctIndex: paired.findIndex(p => p.isCorrect)
      };
    }

    function spawnAmbientPetals() {
      const container = document.getElementById('ambient-petals');
      if (!container) return;
      const petalColors = ['#f4b6bc', '#e88d96', '#f7cfd3', '#e5b869'];
      for (let i = 0; i < 14; i++) {
        const el = document.createElement('div');
        el.className = 'ambient-petal';
        const left = Math.random() * 100;
        const duration = 12 + Math.random() * 14;
        const delay = Math.random() * 12;
        const size = 10 + Math.random() * 8;
        const color = petalColors[i % petalColors.length];
        el.style.left = `${left}vw`;
        el.style.animationDuration = `${duration}s`;
        el.style.animationDelay = `-${delay}s`;
        el.innerHTML = `
          <svg width="${size}" height="${size}" viewBox="0 0 20 20" fill="${color}">
            <path d="M10 1 C14 5, 19 10, 10 19 C1 10, 6 5, 10 1 Z" />
          </svg>
        `;
        container.appendChild(el);
      }
    }

    function initGlossary(filterText = '') {
      const listEl = document.getElementById('glossary-list');
      const keyword = filterText.trim().toLowerCase();
      const filtered = fullGlossary.filter(item => 
        item.foreign.toLowerCase().includes(keyword) || 
        item.korean.toLowerCase().includes(keyword) ||
        String(item.no) === keyword
      );

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="col-span-full text-center py-8 text-[#7a6f60]">검색 결과와 일치하는 단어가 없습니다.</div>`;
        return;
      }

      listEl.innerHTML = filtered.map(item => `
        <div class="flex items-center justify-between p-2.5 rounded-xl bg-white border border-[#e6dcc8] hover:border-[#234d70] transition">
          <div class="flex items-center gap-2">
            <span class="w-6 h-6 rounded-full bg-[#f3ede0] text-[#5c5346] text-xs font-bold flex items-center justify-center shrink-0">${item.no}</span>
            <span class="text-[#5c5346] font-medium">${item.foreign}</span>
          </div>
          <span class="font-bold text-[#234d70] text-right">➔ ${item.korean}</span>
        </div>
      `).join('');
    }

    function filterGlossary(val) {
      initGlossary(val);
    }

      const modal = document.getElementById('glossary-modal');
      if (show) {
        const searchInput = document.getElementById('glossary-search');

        initGlossary('');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      } else {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    }

    // [화면 2] 퀴즈 진행 화면
    function renderQuiz() {
      const total = state.activeQuestions.length;
      const currentQ = state.activeQuestions[state.currentIdx];
      const progress = ((state.currentIdx + (state.isAnswered ? 1 : 0)) / total) * 100;
      const labels = ['가', '나', '다', '라'];

      const optionsHtml = currentQ.options.map((opt, idx) => {
        let btnClass = "bg-white border-2 border-[#e2d6c1] text-[#221f1c]";
        let badgeHtml = `<span class="w-8 h-8 rounded-lg bg-[#f3ede0] border border-[#d6c7ad] text-[#234d70] font-batang font-bold flex items-center justify-center mr-3.5 shrink-0">${labels[idx]}</span>`;
        let statusIcon = "";

        if (state.isAnswered) {
          if (idx === currentQ.correctIndex) {
            btnClass = "bg-[#eef7f4] border-2 border-[#2c6e58] text-[#174234] shadow-sm";
            badgeHtml = `<span class="w-8 h-8 rounded-lg bg-[#2c6e58] text-white font-bold flex items-center justify-center mr-3.5 shrink-0">✓</span>`;
            statusIcon = `<span class="ml-auto text-[#2c6e58] font-bold text-xs sm:text-sm bg-[#d5ede5] px-2.5 py-1 rounded-md border border-[#2c6e58]/30">정답</span>`;
          } else if (idx === state.selectedOption) {
            btnClass = "bg-[#fdf1f1] border-2 border-[#c83e3b] text-[#7a1e1c] animate-shake";
            badgeHtml = `<span class="w-8 h-8 rounded-lg bg-[#c83e3b] text-white font-bold flex items-center justify-center mr-3.5 shrink-0">✕</span>`;
            statusIcon = `<span class="ml-auto text-[#c83e3b] font-bold text-xs sm:text-sm bg-[#fadcd9] px-2.5 py-1 rounded-md border border-[#c83e3b]/30">내 선택</span>`;
          } else {
            btnClass = "bg-[#f9f6f0] border-2 border-[#ebe2d3] text-[#9e9486] opacity-65";
          }
        }

        return `
          <button 
            onclick="selectAnswer(${idx})" 
            ${state.isAnswered ? 'disabled' : ''}
            class="option-card w-full text-left p-4 rounded-xl flex items-center font-medium text-base sm:text-lg ${btnClass} cursor-pointer disabled:cursor-default">
            ${badgeHtml}
            <span class="flex-1">${opt}</span>
            ${statusIcon}
          </button>

      }).join('');

      let feedbackHtml = '';
      if (state.isAnswered) {
        const isCorrect = state.selectedOption === currentQ.correctIndex;
        feedbackHtml = `
          <div class="mt-6 p-5 rounded-xl animate-pop border-2 ${isCorrect ? 'bg-[#eef7f4] border-[#2c6e58]' : 'bg-[#fdf3f2] border-[#c83e3b]'}">
            <div class="flex items-center gap-2.5 mb-2">
              <span class="red-stamp px-2 py-0.5 rounded text-xs ${isCorrect ? '!border-[#2c6e58] !text-[#2c6e58] !bg-[#2c6e58]/10' : ''}">
                ${isCorrect ? '정답이오' : '아쉽소'}
              </span>
              <h3 class="font-batang font-bold text-lg sm:text-xl ${isCorrect ? 'text-[#1c4d3d]' : 'text-[#8c2320]'}">
                ${isCorrect ? '참 잘하셨습니다! 정확히 맞히셨어요.' : `정답은 [ ${currentQ.options[currentQ.correctIndex]} ] 입니다.`}
              </h3>
            </div>
            <p class="text-[#3b352e] text-sm sm:text-base leading-relaxed pl-2 border-l-2 ${isCorrect ? 'border-[#2c6e58]/40' : 'border-[#c83e3b]/40'} ml-1">
              ${currentQ.rationale}
            </p>
            <div class="mt-4 flex justify-end">
              <button onclick="nextQuestion()" class="px-6 py-3 rounded-xl bg-[#234d70] hover:bg-[#193954] text-white font-batang font-bold shadow hover:shadow-md transition-all cursor-pointer flex items-center gap-2">

                <span>➔</span>
              </button>
            </div>
          </div>
        `;
      }

      app.innerHTML = `
        <div class="hanji-card rounded-2xl overflow-hidden animate-pop">
          <div class="dancheong-ribbon"></div>

            <div class="flex items-center justify-between mb-3">
              <div class="flex items-center gap-2">
                ${state.isRetryMode ? `<span class="px-2.5 py-0.5 rounded bg-[#c83e3b] text-white text-xs font-bold">오답 설욕전</span>` : ''}

    // [화면 3] 최종 결과 및 틀린 문제 모아보기 화면
    function renderResult() {
      const total = state.activeQuestions.length;
      const correctCount = state.userAnswers.filter(a => a.isCorrect).length;
      const wrongList = state.userAnswers.filter(a => !a.isCorrect);
      const score = Math.round((correctCount / total) * 100);

        rankTitle = "우등 급제 · 우리말 지킴이";

        wittyClosing = "우리말 사랑이 이미 수준급이십니다! 낯설던 순화어도 자꾸 부르다 보면 정이 드는 법, 오늘 익힌 다정한 우리말 한마디가 내일의 말씨를 더욱 아름답게 꽃피울 거예요.";

        rankTitle = "정진 중 · 우리말 수련생";

        wittyClosing = "괜찮습니다! 몰랐던 우리말을 새로 만나는 즐거움이 더 크니까요. 외래어에 내어주었던 자리를 따뜻하고 알기 쉬운 우리말로 하나씩 채워가는 멋쟁이가 되어보아요!";
      }

      const displayList = state.reviewOnlyWrong ? wrongList : state.userAnswers;

      let reviewHtml = '';
      if (wrongList.length === 0 && state.reviewOnlyWrong) {
        reviewHtml = `
          <div class="text-center py-8 bg-[#eef7f4] rounded-xl border-2 border-[#2c6e58]/40">
            <div class="font-batang font-bold text-2xl text-[#2c6e58] mb-1">🎉 틀린 문제가 단 하나도 없습니다!</div>

          const q = item.questionObj;
          return `
            <div class="p-5 rounded-xl border-2 ${item.isCorrect ? 'bg-white border-[#2c6e58]/40' : 'bg-[#fdf4f3] border-[#c83e3b]/60 shadow-xs'}">
              <div class="flex items-center justify-between mb-2">
                <span class="font-bold text-xs px-2.5 py-1 rounded ${item.isCorrect ? 'bg-[#2c6e58] text-white' : 'bg-[#c83e3b] text-white'}">
                  ${item.isCorrect ? `문항 #${q.id} · 정답 ⭕` : `문항 #${q.id} · 오답 ❌`}
                </span>
              </div>

                <div class="p-2.5 rounded-lg border ${item.isCorrect ? 'bg-[#eef7f4] border-[#2c6e58]/30 text-[#174234]' : 'bg-[#fae3e1] border-[#c83e3b]/30 text-[#7a1e1c]'}">
                  <span class="font-bold">내가 고른 답:</span> ${q.options[item.selectedIdx]}
                </div>
                <div class="p-2.5 rounded-lg bg-[#eef7f4] border border-[#2c6e58]/30 text-[#174234]">
                  <span class="font-bold">올바른 정답:</span> ${q.options[q.correctIndex]}
                </div>
              </div>
              
              <div class="text-xs sm:text-sm text-[#4a4238] bg-[#f9f6f0] p-3 rounded-lg border border-[#e2d6c1]">
                📜 <strong>풀이:</strong> ${q.rationale}
              </div>
            </div>
          `;
        }).join('');
      }

      app.innerHTML = `
        <div class="hanji-card rounded-2xl overflow-hidden animate-pop max-h-[88vh] flex flex-col">
          <div class="dancheong-ribbon shrink-0"></div>
          <div class="p-6 sm:p-8 overflow-y-auto">
            <!-- 성적표 헤더 -->
            <div class="text-center mb-7">
              <span class="red-stamp px-3 py-1 rounded text-sm mb-3">우리말 성적표</span>
              <h2 class="font-batang font-bold text-2xl sm:text-3xl text-[#221f1c] mb-1">${rankTitle}</h2>
              <p class="text-[#5c5346] text-sm sm:text-base mb-5">${message}</p>

              <div class="inline-flex items-center gap-6 bg-[#f7f2e7] px-8 py-4 rounded-xl border-2 border-[#d6c7ad]">
                <div>
                  <div class="text-xs text-[#6e6456] font-bold">총점</div>
                  <div class="font-batang font-bold text-3xl sm:text-4xl text-[#234d70]">
                    ${score}점
                  </div>
                </div>
                <div class="h-10 w-px bg-[#d6c7ad]"></div>
                <div>
                  <div class="text-xs text-[#6e6456] font-bold">정답 / 오답</div>
                  <div class="font-bold text-lg">
                    <span class="text-[#2c6e58]">${correctCount}개</span> / <span class="text-[#c83e3b]">${wrongList.length}개</span>
                  </div>
                </div>
              </div>
            </div>

            <!-- 오답 / 전체 필터 탭 -->
            <div class="flex flex-wrap items-center justify-between gap-2 border-b-2 border-[#e2d6c1] pb-3 mb-5">
              <h3 class="font-batang font-bold text-lg sm:text-xl text-[#221f1c]">
                ${state.reviewOnlyWrong ? `📌 틀린 문제 모아보기 (${wrongList.length}개)` : `📖 전체 문제 풀이 (${total}개)`}
              </h3>
              <div class="flex gap-2">
                <button onclick="toggleFilter(true)" class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition cursor-pointer ${state.reviewOnlyWrong ? 'bg-[#c83e3b] text-white' : 'bg-[#ede4d3] text-[#5c5346] hover:bg-[#e0d3bc]'}">
                  틀린 문제만 (${wrongList.length})
                </button>
                <button onclick="toggleFilter(false)" class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition cursor-pointer ${!state.reviewOnlyWrong ? 'bg-[#234d70] text-white' : 'bg-[#ede4d3] text-[#5c5346] hover:bg-[#e0d3bc]'}">
                  전체 보기 (${total})
                </button>
              </div>
            </div>

            <!-- 복습 카드 목록 -->
            <div class="space-y-4 mb-7">
              ${reviewHtml}
            </div>

            <!-- 우리말 수호 현판 배너 -->
            <div class="mb-8 rounded-2xl bg-gradient-to-b from-[#f7f1e3] to-[#efe5d1] border-2 border-[#c9b79c] p-6 relative overflow-hidden shadow-inner">
              <div class="corner-frame c-tl"></div>
              <div class="corner-frame c-tr"></div>
              <div class="corner-frame c-bl"></div>
              <div class="corner-frame c-br"></div>

              <div class="text-center max-w-xl mx-auto">
                <span class="red-stamp px-2.5 py-0.5 rounded text-xs mb-3">우리말 수호 현판</span>
                <p class="font-batang text-sm sm:text-base text-[#3b332a] leading-relaxed mb-4">
                  ${wittyClosing}
                </p>
                <div class="h-px w-24 bg-[#c83e3b]/40 mx-auto mb-4"></div>
                <p class="font-batang font-bold text-base sm:text-lg text-[#234d70] leading-snug mb-4">
                  “말이 살아야 얼이 삽니다 🌸 — 일상 속 작은 우리말 쓰기, 당신이 오늘 지킨 가장 아름다운 유산입니다.”
                </p>
                <button id="copy-pledge-btn" onclick="copyPledgeQuote(${score})" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg bg-white/90 hover:bg-white border border-[#cbbba0] text-[#4a4238] text-xs sm:text-sm font-bold shadow-xs transition cursor-pointer">
                  <span>📋</span>
                  <span>우리말 수호 다짐 복사하기</span>
                </button>

            <!-- 하단 재도전 버튼 그룹 -->
            <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
              ${wrongList.length > 0 ? `
                <button onclick="retryWrongQuestions()" class="w-full sm:w-auto px-7 py-3.5 rounded-xl bg-[#c83e3b] hover:bg-[#a8302d] text-white font-batang font-bold text-lg shadow-md transition cursor-pointer">
                  🔥 틀린 문제만 다시 풀기 (${wrongList.length}개)

              ` : ''}

                🔄 같은 규모(${total}문제) 다시 풀기
              </button>
              <button onclick="goToStart()" class="w-full sm:w-auto px-6 py-3.5 rounded-xl bg-[#efe5d1] hover:bg-[#e3d4b7] text-[#3b332a] border border-[#cbbba0] font-batang font-bold text-lg transition cursor-pointer">

    // =========================================================================
    // 5. 인터랙션 핸들러
    // =========================================================================
    function goToStart() {
      state.screen = 'start';
      render();
    }

    function startFullQuiz() {
      const selected = initialQuizData
        .slice(0, state.selectedCount)
        .map(q => prepareShuffledQuestion(q));

      state = {
        ...state,
        screen: 'quiz',
        activeQuestions: selected,
        isRetryMode: false,
        currentIdx: 0,
        selectedOption: null,
        isAnswered: false,
        userAnswers: [],
        reviewOnlyWrong: true
      };
      render();
    }

    function retryWrongQuestions() {
      const wrongQuestions = state.userAnswers
        .filter(a => !a.isCorrect)
        .map(a => prepareShuffledQuestion(a.questionObj));
      
      if (wrongQuestions.length === 0) return;

      state = {
        ...state,
        screen: 'quiz',
        activeQuestions: wrongQuestions,
        isRetryMode: true,
        currentIdx: 0,
        selectedOption: null,
        isAnswered: false,
        userAnswers: [],
        reviewOnlyWrong: true
      };
      render();
    }

    function selectAnswer(idx) {
      if (state.isAnswered) return;
      const currentQ = state.activeQuestions[state.currentIdx];
      const isCorrect = idx === currentQ.correctIndex;

      state.selectedOption = idx;
      state.isAnswered = true;
      state.userAnswers.push({
        questionObj: currentQ,
        selectedIdx: idx,
        isCorrect: isCorrect
      });

      if (isCorrect) {
        triggerPetalConfetti(35);
      }
      render();
    }

    function nextQuestion() {
      if (state.currentIdx < state.activeQuestions.length - 1) {
        state.currentIdx++;
        state.selectedOption = null;
        state.isAnswered = false;
        render();
      } else {
        state.screen = 'result';
        render();
      }
    }

    function toggleFilter(onlyWrong) {
      state.reviewOnlyWrong = onlyWrong;
      render();
    }

    function copyPledgeQuote(score) {
      const textToCopy = `[우리말 순화어 과거시험 ${score}점 달성!]\n말이 살아야 얼이 삽니다 🌸 — 일상 속 작은 우리말 쓰기, 당신이 오늘 지킨 가장 아름다운 유산입니다.`;
      const textarea = document.createElement('textarea');
      textarea.value = textToCopy;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        const btn = document.getElementById('copy-pledge-btn');
        if (btn) {
          btn.innerHTML = '<span>✅</span><span>우리말 수호 다짐이 복사되었습니다!</span>';
          btn.classList.add('border-[#2c6e58]', 'text-[#2c6e58]');
          setTimeout(() => {
            btn.innerHTML = '<span>📋</span><span>우리말 수호 다짐 복사하기</span>';
            btn.classList.remove('border-[#2c6e58]', 'text-[#2c6e58]');
          }, 2500);
        }
      } catch (e) {}
      document.body.removeChild(textarea);
    }

    // 매화 꽃잎 & 오방색 축하 꽃가루 애니메이션
    function triggerPetalConfetti(count) {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const colors = ['#c83e3b', '#234d70', '#d99b26', '#2c6e58', '#f2a2a8', '#e6b85c'];
      const particles = Array.from({ length: count }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height * 0.4 - canvas.height * 0.4,
        w: Math.random() * 10 + 6,
        h: Math.random() * 6 + 4,
        speedY: Math.random() * 2.5 + 2,
        speedX: Math.random() * 2 - 1,
        angle: Math.random() * Math.PI * 2,
        spin: (Math.random() - 0.5) * 0.12,
        color: colors[Math.floor(Math.random() * colors.length)]
      }));

      let frame = 0;
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach((p) => {
          p.y += p.speedY;
          p.x += p.speedX + Math.sin(frame * 0.05) * 0.5;
          p.angle += p.spin;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.angle);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.ellipse(0, 0, p.w / 2, p.h / 2, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });
        frame++;
        if (frame < 110) {
          requestAnimationFrame(draw);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      draw();
    }

    // 초기 실행
    spawnAmbientPetals();
    initGlossary();
    render();
  </script>
<script src="../mission-bridge.js"></script>
</body>
